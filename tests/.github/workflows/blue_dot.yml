name: Daily RS Blue Dot CSVs

on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rs-blue-dot-publishing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify blue-dot calculation and candle parsing
        run: python -m unittest discover -s tests -v
      - name: Download prices and generate rankings
        run: python relative-strength.py true
      - name: Check CSV before publishing
        run: |
          python - <<'PY'
          import pandas as pd
          frame = pd.read_csv('output/rs_stocks.csv')
          required = {'Ticker', 'RS_Before_Price', 'RS_Blue_Dot', 'RS_Signal_Status'}
          if frame.empty or not required.issubset(frame.columns):
              raise SystemExit('Generated CSV is empty or lacks signal columns.')
          if not frame['RS_Signal_Status'].isin(['OK', 'SHORT_HISTORY']).any():
              raise SystemExit('No usable RS signals: inspect benchmark/date availability before publishing.')
          print(f'Publishing {len(frame)} rows with RS signal columns.')
          PY
      - name: Publish CSVs to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The original project's .gitignore excludes output/.
          git add -f -- output/*.csv
          git add -- data_persist/ticker_info.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update daily RS rankings and blue-dot signals"
            git push
          fi
      - name: Make CSVs available for download
        uses: actions/upload-artifact@v4
        with:
          name: rs-blue-dot-csvs
          path: output/*.csv
          if-no-files-found: error
