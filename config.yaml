# Data Retrieval
# Available Sources: YAHOO, TD_AMERITRADE
DATA_SOURCE: YAHOO

# Not needed if you use YAHOO
API_KEY: Your_API_Key

# Which Ticker should be the reference for performance?
REFERENCE_TICKER: SPY

# Separate S&P 500 index benchmark for the daily RS-line blue-dot signal.
# The downloader includes this ticker automatically. Rankings still use SPY.
RS_LINE_REFERENCE_TICKER: "^GSPC"

# What is the lowest Percentile you want to see?
MIN_PERCENTILE: 0

# Do you want all listed stocks?
USE_ALL_LISTED_STOCKS: true

# If USE_ALL_LISTED_STOCKS is false: Only those stocks are considered which are included in the enabled indices
NQ100: true
SP500: true
SP400: true
SP600: true

# Program behavior
# Should the program wait for you to hit enter to exit?
EXIT_WAIT_FOR_ENTER: true

# Gapper scan (gappers.py -> output/gappers.csv), Oliver Kell's criteria.
# Gap = session open vs previous close, in percent. RVOL = gap-day volume vs
# the prior 50-day average. Price and volume are checked on the gap day.
GAP_MIN_PCT: 3
GAP_MIN_RVOL: 3
GAP_MIN_PRICE: 20
GAP_MIN_VOLUME: 500000
GAP_LOOKBACK_DAYS: 10

# Pullback scan (setups.py -> output/setups.csv): "weakness after strength".
# Strength = at least SETUP_MIN_DOTS daily RS blue dots in the last
# SETUP_DOT_WINDOW sessions. Weakness = latest dot SETUP_MIN_DAYS_SINCE_DOT to
# SETUP_MAX_DAYS_SINCE_DOT sessions old. Support = close within SETUP_NEAR_PCT %
# of the 21-day EMA or 8-week EMA. Trend = rising 8-week EMA, close > 50-day SMA.
SETUP_MIN_RS: 80
SETUP_DOT_WINDOW: 40
SETUP_MIN_DOTS: 3
SETUP_MIN_DAYS_SINCE_DOT: 5
SETUP_MAX_DAYS_SINCE_DOT: 20
SETUP_NEAR_PCT: 3
